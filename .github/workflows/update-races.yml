name: Update today's races

on:
  schedule:
    # GitHub ActionsのcronはUTC。15:05 UTC = 翌日00:05 JST。
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-today-races
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch today's races
        run: python scripts/update_races.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/today-races.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today-races.json
          git commit -m "本日のレース情報を更新"
          git push
